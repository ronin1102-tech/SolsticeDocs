[package]
name = "solstice-docs"
version = "0.1.0"
description = "Solstice Docs — local-first PDF workspace"
authors = ["Solstice AI"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "solstice_docs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Catalina (10.15) dev workaround — issue tauri-apps/tauri#15431 / wry#1678:
# objc2's dev-only debug assertion panics at window creation because wry
# registers WKNavigationDelegate.didBecomeDownload (macOS 11.3+) that Catalina's
# WebKit lacks. With assertions off the optional method is simply never called
# on old OSes — a local-first PDF app never triggers it. Release builds are
# unaffected (assertions are dev-only). Remove this block if we ever drop 10.15.
[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
